<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Поймай додо 🦤</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', 'Comic Sans MS', sans-serif;
  background: linear-gradient(160deg, #ffe3ef 0%, #ffd6e8 40%, #ffe9f3 100%);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  padding: 10px;
}

h1 {
  font-size: clamp(1.4rem, 4vw, 2.4rem);
  color: #d1568a;
  text-shadow: 0 2px 10px #ffffffaa;
  margin-bottom: 4px;
  text-align: center;
}

.subtitle {
  color: #c97aa5;
  font-size: clamp(0.75rem, 2.2vw, 1rem);
  margin-bottom: 10px;
  text-align: center;
}

#hud {
  display: flex;
  gap: 20px;
  margin-bottom: 8px;
  font-size: clamp(0.9rem, 2.4vw, 1.2rem);
  color: #b85385;
  font-weight: 700;
  background: #ffffffcc;
  padding: 8px 22px;
  border-radius: 40px;
  box-shadow: 0 6px 18px #f6b8d4aa, inset 0 0 0 2px #ffd9ea;
}

#hud span { color: #e2699f; }

#timerBarWrap {
  width: min(92vw, 620px);
  height: 10px;
  background: #ffffffaa;
  border-radius: 20px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: inset 0 0 0 2px #ffd9ea;
}

#timerBar {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #ffb3d1, #f57fb0);
  border-radius: 20px;
}

#game {
  position: relative;
  width: min(92vw, 620px);
  height: min(60vh, 520px);
  background: linear-gradient(180deg, #fff4f9 0%, #ffe6f1 55%, #ffdcec 100%);
  border-radius: 34px;
  box-shadow: 0 18px 50px #e79cc0aa, inset 0 0 0 4px #ffffffcc, inset 0 0 40px #ffd0e5;
  overflow: hidden;
  touch-action: none;
}

.cloud {
  position: absolute;
  background: #ffffff88;
  border-radius: 50%;
  filter: blur(2px);
  pointer-events: none;
}

.dodo {
  position: absolute;
  width: 70px;
  height: 70px;
  font-size: 52px;
  line-height: 70px;
  text-align: center;
  pointer-events: auto;
  cursor: pointer;
  filter: drop-shadow(0 6px 10px #e08ab655);
  will-change: left, top;
  touch-action: none;
}

.dodo.pop {
  animation: pop .35s ease-out forwards;
  pointer-events: none;
}

@keyframes pop {
  0%   { transform: scale(1) rotate(0deg); opacity: 1; }
  45%  { transform: scale(1.6) rotate(-12deg); opacity: .9; }
  100% { transform: scale(0.1) rotate(25deg) translateY(-30px); opacity: 0; }
}

.float-text {
  position: absolute;
  color: #e2699f;
  font-weight: 800;
  font-size: 22px;
  pointer-events: none;
  animation: floatUp .8s ease-out forwards;
  text-shadow: 0 2px 8px #fff;
}

.hearts {
  position: absolute;
  pointer-events: none;
  font-size: 22px;
  animation: floatUp 1s ease-out forwards;
}

@keyframes floatUp {
  0%   { transform: translateY(0) scale(.7); opacity: 0; }
  25%  { transform: translateY(-10px) scale(1.15); opacity: 1; }
  100% { transform: translateY(-70px) scale(1); opacity: 0; }
}

#startScreen, #endScreen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  background: #ffeef6ee;
  z-index: 20;
  gap: 16px;
}

#endScreen { display: none; }

.big-emoji {
  font-size: clamp(3rem, 12vw, 5rem);
  animation: bounce 1.6s infinite ease-in-out;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50%      { transform: translateY(-16px) rotate(4deg); }
}

.btn {
  border: none;
  padding: 14px 40px;
  font-size: clamp(1rem, 2.6vw, 1.2rem);
  font-weight: 800;
  font-family: inherit;
  color: #fff;
  background: linear-gradient(135deg, #ffa6c9, #f57fb0);
  border-radius: 40px;
  cursor: pointer;
  box-shadow: 0 10px 24px #f18bb8aa, inset 0 -3px 0 #d96b9b;
  transition: transform .15s ease;
  touch-action: manipulation;
}

.btn:hover { transform: translateY(-3px) scale(1.04); }
.btn:active { transform: translateY(1px) scale(.98); }

.compliment {
  font-size: clamp(1.05rem, 3.2vw, 1.6rem);
  color: #d1568a;
  font-weight: 800;
  line-height: 1.5;
  max-width: 480px;
  text-shadow: 0 2px 10px #ffffffcc;
}

.end-stats {
  color: #c97aa5;
  font-size: clamp(0.9rem, 2.4vw, 1.1rem);
  font-weight: 700;
}
</style>
</head>
<body>

<h1>Поймай додо 🦤</h1>
<div class="subtitle">Кликай по додо, пока не вышло время!</div>

<div id="hud">
  <div>Поймано: <span id="score">0</span></div>
  <div>Время: <span id="time">30</span>с</div>
</div>

<div id="timerBarWrap"><div id="timerBar"></div></div>

<div id="game">
  <div id="startScreen">
    <div class="big-emoji">🦤</div>
    <div class="compliment">Готова ловить додо?</div>
    <button class="btn" id="startBtn">Начать игру</button>
  </div>

  <div id="endScreen">
    <div class="big-emoji">🦤💕</div>
    <div class="compliment">Ты моя умничка! Ты поймала очень много дод! Молодец!</div>
    <div class="end-stats">Поймано додо: <span id="finalScore">0</span></div>
    <button class="btn" id="againBtn">Играть снова</button>
  </div>
</div>

<script>
(function() {
  var game = document.getElementById('game');
  var scoreEl = document.getElementById('score');
  var timeEl = document.getElementById('time');
  var timerBar = document.getElementById('timerBar');
  var startScreen = document.getElementById('startScreen');
  var endScreen = document.getElementById('endScreen');
  var finalScore = document.getElementById('finalScore');
  var startBtn = document.getElementById('startBtn');
  var againBtn = document.getElementById('againBtn');

  var GAME_TIME = 30;
  var MAX_DODOS = 8;
  var score = 0;
  var timeLeft = GAME_TIME;
  var running = false;
  var spawnTimer = null;
  var countTimer = null;
  var dodos = [];
  var animId = null;

  for (var i = 0; i < 7; i++) {
    var c = document.createElement('div');
    c.className = 'cloud';
    var size = 60 + Math.random() * 130;
    c.style.width = size + 'px';
    c.style.height = (size * 0.55) + 'px';
    c.style.left = (Math.random() * 90) + '%';
    c.style.top = (Math.random() * 90) + '%';
    c.style.opacity = 0.35 + Math.random() * 0.4;
    game.appendChild(c);
  }

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function spawnDodo() {
    if (!running) return;
    if (dodos.length >= MAX_DODOS) return;

    var d = document.createElement('div');
    d.className = 'dodo';
    d.textContent = '🦤';

    var rect = game.getBoundingClientRect();
    var maxX = Math.max(10, rect.width - 75);
    var maxY = Math.max(10, rect.height - 75);

    var x = rand(0, maxX);
    var y = rand(0, maxY);

    d.style.left = x + 'px';
    d.style.top = y + 'px';
    d.style.transform = 'rotate(' + rand(-10, 10) + 'deg)';

    d._caught = false;
    d._x = x;
    d._y = y;
    d._vx = rand(-0.6, 0.6);
    d._vy = rand(-0.6, 0.6);
    d._life = 2200 + Math.random() * 1500;
    d._born = performance.now();

    d.addEventListener('pointerdown', onCatch);
    d.addEventListener('touchstart', onCatch, { passive: false });

    game.appendChild(d);
    dodos.push(d);
  }

  function onCatch(e) {
    e.preventDefault();
    e.stopPropagation();
    var d = e.currentTarget;
    if (!d || d._caught || !running) return;
    d._caught = true;
    score++;
    scoreEl.textContent = score;

    var rect = game.getBoundingClientRect();
    var dr = d.getBoundingClientRect();
    var px = dr.left - rect.left + dr.width / 2;
    var py = dr.top - rect.top + dr.height / 2;

    showFloat(px, py, '+1');
    showHearts(px, py);

    d.classList.add('pop');
    setTimeout(function() { removeDodo(d); }, 350);
  }

  function showFloat(x, y, text) {
    var f = document.createElement('div');
    f.className = 'float-text';
    f.textContent = text;
    f.style.left = x + 'px';
    f.style.top = y + 'px';
    game.appendChild(f);
    setTimeout(function() { if (f.parentNode) f.parentNode.removeChild(f); }, 800);
  }

  function showHearts(x, y) {
    var hearts = ['💗', '💖', '🌸', '💕'];
    for (var i = 0; i < 3; i++) {
      var h = document.createElement('div');
      h.className = 'hearts';
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = (x + rand(-30, 30)) + 'px';
      h.style.top = (y + rand(-20, 20)) + 'px';
      h.style.animationDelay = (i * 0.08) + 's';
      game.appendChild(h);
      (function(el) {
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 1100);
      })(h);
    }
  }

  function removeDodo(d) {
    var i = dodos.indexOf(d);
    if (i > -1) dodos.splice(i, 1);
    if (d.parentNode) d.parentNode.removeChild(d);
  }

  function tick(now) {
    if (!running) return;

    var rect = game.getBoundingClientRect();
    var maxX = Math.max(10, rect.width - 75);
    var maxY = Math.max(10, rect.height - 75);

    for (var i = dodos.length - 1; i >= 0; i--) {
      var d = dodos[i];
      if (d._caught) continue;

      if (now - d._born > d._life) {
        d.style.transition = 'opacity .4s, transform .4s';
        d.style.opacity = '0';
        d.style.transform = 'scale(0.5)';
        (function(el) {
          setTimeout(function() { removeDodo(el); }, 400);
        })(d);
        d._caught = true;
        continue;
      }

      d._x += d._vx;
      d._y += d._vy;

      if (d._x < 0) { d._x = 0; d._vx *= -1; }
      if (d._x > maxX) { d._x = maxX; d._vx *= -1; }
      if (d._y < 0) { d._y = 0; d._vy *= -1; }
      if (d._y > maxY) { d._y = maxY; d._vy *= -1; }

      d.style.left = d._x + 'px';
      d.style.top = d._y + 'px';
    }

    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    score = 0;
    timeLeft = GAME_TIME;
    running = true;
    scoreEl.textContent = '0';
    timeEl.textContent = GAME_TIME;
    timerBar.style.width = '100%';

    for (var i = dodos.length - 1; i >= 0; i--) {
      removeDodo(dodos[i]);
    }
    dodos = [];

    startScreen.style.display = 'none';
    endScreen.style.display = 'none';

    if (spawnTimer) clearInterval(spawnTimer);
    if (countTimer) clearInterval(countTimer);
    if (animId) cancelAnimationFrame(animId);

    spawnTimer = setInterval(function() {
      if (running) spawnDodo();
    }, 550);

    countTimer = setInterval(function() {
      timeLeft--;
      timeEl.textContent = timeLeft;
      timerBar.style.width = (timeLeft / GAME_TIME * 100) + '%';
      if (timeLeft <= 0) endGame();
    }, 1000);

    spawnDodo();
    spawnDodo();
    animId = requestAnimationFrame(tick);
  }

  function endGame() {
    running = false;
    if (spawnTimer) clearInterval(spawnTimer);
    if (countTimer) clearInterval(countTimer);
    if (animId) cancelAnimationFrame(animId);
    spawnTimer = null;
    countTimer = null;
    animId = null;

    for (var i = dodos.length - 1; i >= 0; i--) {
      var d = dodos[i];
      if (d.parentNode) {
        d.style.transition = 'opacity .4s';
        d.style.opacity = '0';
      }
    }
    var toRemove = dodos.slice();
    dodos = [];
    setTimeout(function() {
      for (var j = 0; j < toRemove.length; j++) {
        if (toRemove[j].parentNode) toRemove[j].parentNode.removeChild(toRemove[j]);
      }
    }, 450);

    finalScore.textContent = score;
    endScreen.style.display = 'flex';
  }

  startBtn.addEventListener('click', function(e) {
    e.preventDefault();
    startGame();
  });

  againBtn.addEventListener('click', function(e) {
    e.preventDefault();
    startGame();
  });

  startBtn.addEventListener('touchend', function(e) {
    e.preventDefault();
    startGame();
  }, { passive: false });

  againBtn.addEventListener('touchend', function(e) {
    e.preventDefault();
    startGame();
  }, { passive: false });
})();
</script>
</body>
</html>
